<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería Interactiva</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="app">
    <h1>📸 Galería Interactiva</h1>
    <p class="subtitle">Agrega, selecciona y elimina imágenes</p>

    <div class="controls">
      <input type="url" id="imageUrl" placeholder="Pega la URL de la imagen">
      <button id="addImage">Agregar Imagen</button>
      <button id="deleteImage" class="danger">Eliminar Seleccionada</button>
    </div>

    <section class="gallery" id="gallery"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>

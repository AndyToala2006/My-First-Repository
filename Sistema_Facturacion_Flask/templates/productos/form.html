{% extends "base.html" %}

{% block content %}
<section class="panel form-panel">
    <h2>{{ accion }} producto</h2>
    <form method="post" class="form-grid">
        <div class="field">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" value="{{ form.nombre }}" required>
        </div>

        <div class="field">
            <label for="precio">Precio</label>
            <input id="precio" name="precio" type="number" min="0.01" step="0.01" value="{{ form.precio }}" required>
        </div>

        <div class="field">
            <label for="stock">Stock</label>
            <input id="stock" name="stock" type="number" min="0" value="{{ form.stock }}" required>
        </div>

        <div class="actions">
            <button type="submit">{{ accion }}</button>
            <a class="btn btn-ghost" href="{{ url_for('productos_list') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}

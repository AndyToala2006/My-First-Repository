{% extends "base.html" %}

{% block content %}
<section class="panel form-panel">
    <h2>{{ accion }} usuario (MySQL)</h2>
    <form method="post" class="form-grid">
        <div class="field">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" value="{{ usuario.nombre if usuario else '' }}" required>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" value="{{ usuario.email if usuario else '' }}" required>
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="text" value="{{ usuario.password if usuario else '' }}" required>
        </div>

        <div class="actions">
            <button type="submit">{{ accion }}</button>
            <a class="btn btn-ghost" href="{{ url_for('mysql_usuarios') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
